<style>
/* =====================================================================
   Wild Projects — site styles
   Everything is scoped under .wp so it can be dropped into Squarespace
   without clashing with the template's own styles.
   ===================================================================== */
.wp {
  --ink: #14201a;
  --pine: #1d3329;
  --pine-2: #27443a;
  --timber: #c47d3f;
  --timber-2: #dda36a;
  --timber-ink: #8f5424;
  --cream: #f4eee3;
  --paper: #faf7f1;
  --white: #ffffff;
  --stone: #5e655f;
  --line: rgba(20, 32, 26, .12);
  --line-light: rgba(255, 255, 255, .14);
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  --shadow: 0 30px 60px -30px rgba(20, 32, 26, .35);
  --ease: cubic-bezier(.2, .7, .2, 1);
  --header-h: 84px;

  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.7;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: clip;
}
.wp *, .wp *::before, .wp *::after { box-sizing: border-box; }
.wp img { display: block; max-width: 100%; height: auto; }
.wp a { color: inherit; text-decoration: none; }
.wp p, .wp h1, .wp h2, .wp h3, .wp ul, .wp ol, .wp dl, .wp dd, .wp figure { margin: 0; padding: 0; }
.wp ul, .wp ol { list-style: none; }
.wp button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.wp :focus-visible { outline: 2px solid var(--timber); outline-offset: 3px; border-radius: 4px; }
.wp-body { margin: 0; background: #faf7f1; }

.wp .wp-ico { width: 1.1em; height: 1.1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wp .wp-container { width: min(1240px, 100% - 48px); margin-inline: auto; }
.wp .wp-narrow { max-width: 820px; }

.wp .wp-skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--timber); color: #fff; padding: 10px 16px; border-radius: 8px; }
.wp .wp-skip:focus { top: 12px; }

/* ---------------------------------------------------------------- type */
.wp .wp-display, .wp .wp-h2, .wp .wp-card__title, .wp .wp-step__title, .wp .wp-cta__title {
  font-family: var(--serif);
  font-weight: 500;
  letter-spacing: -.02em;
  line-height: 1.08;
  font-variation-settings: "opsz" 144;
}
.wp .wp-display { font-size: clamp(3.2rem, 8vw, 6.6rem); color: #fff; }
.wp .wp-display--page { font-size: clamp(2.3rem, 5vw, 4.1rem); max-width: 18ch; }
.wp .wp-h2 { font-size: clamp(1.9rem, 3.6vw, 2.9rem); color: var(--ink); }
.wp .wp-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: .78rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  color: var(--timber-2);
}
.wp .wp-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--timber); box-shadow: 0 0 0 4px rgba(196, 125, 63, .25); }
.wp .wp-kicker { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; font-size: .78rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--timber-ink); }
.wp .wp-kicker::after { content: ""; width: 56px; height: 1px; background: currentColor; opacity: .5; }
.wp .wp-kicker--light { color: var(--timber-2); }

.wp .wp-prose p + p, .wp .wp-prose p + ul, .wp .wp-prose ul + p { margin-top: 1.1em; }
.wp .wp-prose p { color: #33403a; }

/* ---------------------------------------------------------------- buttons */
.wp .wp-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.wp .wp-btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 52px; padding: 0 26px; border-radius: 999px;
  font-weight: 700; font-size: .95rem; letter-spacing: .01em; white-space: nowrap;
  transition: transform .35s var(--ease), background-color .35s var(--ease), color .35s, box-shadow .35s, border-color .35s;
  overflow: hidden; isolation: isolate;
}
.wp .wp-btn .wp-ico { transition: transform .35s var(--ease); }
.wp .wp-btn:hover .wp-ico:last-child { transform: translateX(4px); }
.wp .wp-btn--timber { background: var(--timber); color: #fff; box-shadow: 0 12px 30px -12px rgba(196, 125, 63, .7); }
.wp .wp-btn--timber:hover { background: var(--timber-ink); transform: translateY(-2px); }
.wp .wp-btn--ghost { color: #fff; border: 1px solid rgba(255, 255, 255, .35); backdrop-filter: blur(6px); background: rgba(255, 255, 255, .04); }
.wp .wp-btn--ghost:hover { background: #fff; color: var(--ink); border-color: #fff; }
.wp .wp-btn--sm { height: 44px; padding: 0 20px; font-size: .88rem; }
.wp .wp-btn--block { width: 100%; }

/* ---------------------------------------------------------------- header */
.wp .wp-header {
  position: fixed; inset: 0 0 auto 0; z-index: 50; height: var(--header-h);
  display: flex; align-items: center;
  transition: background-color .4s var(--ease), box-shadow .4s, height .4s var(--ease);
}
.wp .wp-header.is-scrolled { --header-h: 70px; background: rgba(250, 247, 241, .9); backdrop-filter: blur(14px) saturate(1.4); box-shadow: 0 1px 0 var(--line); }
.wp .wp-header__inner { display: flex; align-items: center; gap: 28px; }
.wp .wp-logo img { width: 150px; height: auto; filter: brightness(0) invert(1); transition: filter .4s, width .4s var(--ease); }
.wp .wp-header.is-scrolled .wp-logo img { filter: none; width: 132px; }
.wp .wp-nav { margin-left: auto; }
.wp .wp-nav__list { display: flex; align-items: center; gap: 4px; }
.wp .wp-nav__link {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 999px;
  font-size: .93rem; font-weight: 600; color: rgba(255, 255, 255, .88); transition: color .3s, background-color .3s;
}
.wp .wp-nav__link:hover, .wp .wp-nav__link[aria-current="page"], .wp .wp-nav__item.is-active > .wp-nav__link { color: #fff; background: rgba(255, 255, 255, .1); }
.wp .wp-header.is-scrolled .wp-nav__link { color: var(--ink); }
.wp .wp-header.is-scrolled .wp-nav__link:hover, .wp .wp-header.is-scrolled .wp-nav__link[aria-current="page"], .wp .wp-header.is-scrolled .wp-nav__item.is-active > .wp-nav__link { background: rgba(20, 32, 26, .06); }
.wp .wp-nav__link .wp-ico { width: 15px; transition: transform .3s; }
.wp .wp-nav__item--drop { position: relative; }
.wp .wp-nav__item--drop.is-open .wp-nav__link .wp-ico { transform: rotate(180deg); }
.wp .wp-drop {
  position: absolute; top: calc(100% + 10px); left: 50%; min-width: 250px; padding: 8px;
  background: #fff; border-radius: 14px; box-shadow: 0 24px 50px -20px rgba(20, 32, 26, .4), 0 0 0 1px var(--line);
  opacity: 0; visibility: hidden; transform: translate(-50%, 8px); transition: opacity .25s, transform .3s var(--ease), visibility .25s;
}
.wp .wp-drop::before { content: ""; position: absolute; inset: -12px 0 auto; height: 12px; }
.wp .wp-nav__item--drop.is-open .wp-drop { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.wp .wp-drop__link { display: block; padding: 10px 14px; border-radius: 9px; font-size: .92rem; font-weight: 600; color: var(--ink); transition: background-color .2s, color .2s; }
.wp .wp-drop__link:hover, .wp .wp-drop__link[aria-current="page"] { background: var(--cream); color: var(--timber-ink); }
.wp .wp-nav__item--mobile, .wp .wp-nav__foot { display: none; }
.wp .wp-burger { display: none; width: 46px; height: 46px; border-radius: 50%; position: relative; border: 1px solid rgba(255, 255, 255, .35); }
.wp .wp-header.is-scrolled .wp-burger { border-color: var(--line); }
.wp .wp-burger span { position: absolute; left: 13px; right: 13px; height: 2px; background: #fff; border-radius: 2px; transition: transform .35s var(--ease), top .35s var(--ease), background-color .3s; }
.wp .wp-burger span:first-child { top: 18px; }
.wp .wp-burger span:last-child { top: 26px; }
.wp .wp-header.is-scrolled .wp-burger span { background: var(--ink); }

/* ---------------------------------------------------------------- hero (home) */
.wp .wp-hero { position: relative; color: #fff; background: var(--ink); overflow: hidden; isolation: isolate; }
.wp .wp-hero--home {
  min-height: max(720px, 100svh); display: flex; flex-direction: column; justify-content: center;
  padding: calc(var(--header-h) + 40px) 0 0;
  background:
    radial-gradient(1200px 600px at 75% 40%, rgba(196, 125, 63, .18), transparent 60%),
    radial-gradient(900px 700px at 10% 100%, rgba(39, 68, 58, .9), transparent 70%),
    linear-gradient(160deg, #1a2b23 0%, #101a15 100%);
}
.wp .wp-hero__3d { position: absolute; inset: 0; z-index: -1; }
.wp .wp-hero__3d canvas { display: block; width: 100% !important; height: 100% !important; }
.wp .wp-hero__glow { position: absolute; inset: auto 0 0 0; height: 40%; z-index: -1; background: linear-gradient(to top, #101a15, transparent); pointer-events: none; }
.wp .wp-hero__grid { flex: 1; display: flex; align-items: center; }
.wp .wp-hero__copy { max-width: 640px; padding: 40px 0; }
.wp .wp-hero__copy .wp-display { margin: 22px 0 18px; }
.wp .wp-hero__sub { font-family: var(--serif); font-weight: 400; font-style: italic; font-size: clamp(1.25rem, 2.2vw, 1.6rem); line-height: 1.35; color: var(--timber-2); max-width: 30ch; }
.wp .wp-hero__lead { margin-top: 22px; color: rgba(255, 255, 255, .78); font-size: 1.02rem; max-width: 60ch; }
.wp .wp-hero__foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; padding: 30px 0 34px; border-top: 1px solid var(--line-light); margin-top: 20px; }
.wp .wp-stats { display: flex; gap: clamp(26px, 6vw, 80px); }
.wp .wp-stat { display: flex; flex-direction: column-reverse; }
.wp .wp-stat dt { font-size: .8rem; letter-spacing: .06em; color: rgba(255, 255, 255, .6); }
.wp .wp-stat dd { font-family: var(--serif); font-size: clamp(2rem, 3.6vw, 2.8rem); line-height: 1.1; color: #fff; }
.wp .wp-stat dd b { font-weight: 500; }
.wp .wp-stat dd small { font-family: var(--sans); font-size: .9rem; margin-left: 4px; color: var(--timber-2); }
.wp .wp-hero__scroll { display: flex; align-items: center; gap: 12px; font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(255, 255, 255, .55); }
.wp .wp-hero__scroll span { width: 1px; height: 46px; background: linear-gradient(var(--timber-2), transparent); animation: wpScroll 2.2s var(--ease) infinite; transform-origin: top; }
@keyframes wpScroll { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

/* ticker */
.wp .wp-ticker { background: var(--timber); color: #fff; overflow: hidden; padding: 16px 0; }
.wp .wp-ticker__track { display: flex; width: max-content; gap: 28px; animation: wpTicker 40s linear infinite; }
.wp .wp-ticker span { font-family: var(--serif); font-size: 1.35rem; font-style: italic; white-space: nowrap; }
.wp .wp-ticker i { font-style: normal; opacity: .6; align-self: center; font-size: .8rem; }
@keyframes wpTicker { to { transform: translateX(-50%); } }

/* ---------------------------------------------------------------- hero (inner pages) */
.wp .wp-hero--page { min-height: 640px; display: flex; align-items: flex-end; padding: calc(var(--header-h) + 60px) 0 80px; }
.wp .wp-hero--short { min-height: 460px; }
.wp .wp-hero__bg { position: absolute; inset: -6% 0; z-index: -2; will-change: transform; }
.wp .wp-hero__bg img { width: 100%; height: 100%; object-fit: cover; }
.wp .wp-hero__shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, rgba(16, 26, 21, .92) 0%, rgba(16, 26, 21, .72) 45%, rgba(16, 26, 21, .25) 100%), linear-gradient(to top, rgba(16, 26, 21, .6), transparent 40%); }
.wp .wp-hero__inner > .wp-display { margin: 18px 0 0; }
.wp .wp-hero--page .wp-hero__sub { margin-top: 14px; }
.wp .wp-hero--page .wp-hero__lead { max-width: 62ch; }
.wp .wp-crumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; font-size: .82rem; color: rgba(255, 255, 255, .6); }
.wp .wp-crumbs a:hover { color: #fff; }
.wp .wp-crumbs [aria-current] { color: #fff; }

/* intro */
.wp .wp-intro { background: var(--cream); padding: clamp(60px, 8vw, 100px) 0; }
.wp .wp-intro__inner { display: grid; grid-template-columns: 70px 1fr; gap: 0 30px; max-width: 980px; }
.wp .wp-intro__mark { grid-row: span 3; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--pine); color: var(--timber-2); font-size: 1.4rem; }
.wp .wp-intro__text { grid-column: 2; font-family: var(--serif); font-size: clamp(1.25rem, 2.1vw, 1.6rem); line-height: 1.5; color: var(--pine); }
.wp .wp-intro__text + .wp-intro__text { margin-top: 18px; }

/* ---------------------------------------------------------------- sections */
.wp .wp-section { padding: clamp(80px, 10vw, 140px) 0; background: var(--paper); }
.wp .wp-section--alt { background: #fff; }
.wp .wp-section--paper { background: var(--cream); }
.wp .wp-head { margin-bottom: 26px; }
.wp .wp-head--center { text-align: center; }
.wp .wp-split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 7vw, 110px); align-items: center; }
.wp .wp-split--flip .wp-split__media { order: -1; }
.wp .wp-split__media { position: relative; perspective: 1200px; }
.wp .wp-frame { position: relative; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transform-style: preserve-3d; transition: transform .6s var(--ease); }
.wp .wp-frame img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; transition: transform 1.2s var(--ease); }
.wp .wp-frame:hover img { transform: scale(1.04); }
.wp .wp-split__media::before { content: ""; position: absolute; inset: 22px -22px -22px 22px; border: 1px solid var(--timber); border-radius: var(--radius); z-index: 0; opacity: .55; }
.wp .wp-split--flip .wp-split__media::before { inset: 22px 22px -22px -22px; }
.wp .wp-split__media > .wp-frame { z-index: 1; }
.wp .wp-split__media--duo { padding-bottom: 70px; padding-right: 60px; }
.wp .wp-split__media--duo::before { inset: 22px 38px 48px 22px; }
.wp .wp-frame--inset { position: absolute !important; right: 0; bottom: 0; width: 48%; border: 6px solid var(--paper); z-index: 2 !important; }
.wp .wp-frame--inset img { aspect-ratio: 1; }
.wp .wp-frame__badge { position: absolute; top: -22px; left: -22px; z-index: 3; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--pine); color: var(--timber-2); font-size: 1.6rem; box-shadow: var(--shadow); }
.wp .wp-split--flip .wp-frame__badge { left: auto; right: -22px; }

.wp .wp-features { display: grid; gap: 14px; margin-top: 22px; }
.wp .wp-feature { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: rgba(255, 255, 255, .7); border: 1px solid var(--line); border-radius: 12px; transition: border-color .3s, transform .4s var(--ease), background-color .3s; }
.wp .wp-section--alt .wp-feature { background: var(--paper); }
.wp .wp-feature:hover { border-color: rgba(196, 125, 63, .5); transform: translateX(4px); }
.wp .wp-feature .wp-ico { margin-top: 4px; width: 22px; height: 22px; padding: 4px; border-radius: 50%; background: var(--timber); color: #fff; stroke-width: 2.6; }
.wp .wp-feature p { color: #33403a; font-size: .97rem; line-height: 1.6; }
.wp .wp-feature strong { color: var(--ink); font-weight: 700; }

/* cards */
.wp .wp-cards-head { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 80px; align-items: end; margin-bottom: 56px; }
.wp .wp-cards-head .wp-head { margin: 0; }
.wp .wp-cards { display: grid; gap: 20px; grid-template-columns: repeat(4, 1fr); perspective: 1400px; }
.wp .wp-cards--3 { grid-template-columns: repeat(3, 1fr); }
.wp .wp-card {
  position: relative; display: flex; flex-direction: column; gap: 14px; padding: 34px 28px 30px;
  background: #fff; border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden;
  transform-style: preserve-3d; transition: transform .5s var(--ease), box-shadow .5s, border-color .4s;
}
.wp .wp-card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--timber), var(--timber-2)); transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease); }
.wp .wp-card:hover { box-shadow: var(--shadow); border-color: transparent; }
.wp .wp-card:hover::after { transform: scaleX(1); }
.wp .wp-card__num { font-family: var(--serif); font-size: 2.6rem; line-height: 1; color: var(--timber); font-style: italic; transform: translateZ(30px); }
.wp .wp-card__title { font-size: 1.45rem; transform: translateZ(20px); }
.wp .wp-card__text { color: var(--stone); font-size: .96rem; line-height: 1.65; }
.wp .wp-card__text--lg { font-family: var(--serif); font-size: 1.22rem; color: var(--ink); line-height: 1.4; }
.wp .wp-card__more { margin-top: auto; padding-top: 10px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: .88rem; color: var(--timber-ink); }
.wp .wp-card:hover .wp-card__more .wp-ico { transform: translateX(4px); }
.wp .wp-card__more .wp-ico { transition: transform .3s var(--ease); }
.wp .wp-cards-after { max-width: 820px; margin-top: 44px; }
.wp .wp-section--paper .wp-actions { margin-top: 30px; }

/* steps */
.wp .wp-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; counter-reset: s; position: relative; }
.wp .wp-steps::before { content: ""; position: absolute; top: 34px; left: 8%; right: 8%; height: 1px; background: repeating-linear-gradient(90deg, var(--timber) 0 8px, transparent 8px 16px); opacity: .6; }
.wp .wp-step { position: relative; padding: 0 10px; }
.wp .wp-step__num { position: relative; display: grid; place-items: center; width: 68px; height: 68px; border-radius: 50%; background: var(--pine); color: var(--timber-2); font-family: var(--serif); font-size: 1.4rem; margin-bottom: 22px; box-shadow: 0 0 0 8px var(--cream); }
.wp .wp-step__title { font-size: 1.45rem; margin-bottom: 8px; }
.wp .wp-step p { color: var(--stone); }

/* band */
.wp .wp-band { background: var(--pine); color: #fff; padding: clamp(80px, 10vw, 130px) 0; position: relative; overflow: hidden; }
.wp .wp-band::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--line-light) 1px, transparent 1px), linear-gradient(90deg, var(--line-light) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse at 70% 50%, #000 0%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 70% 50%, #000 0%, transparent 70%); opacity: .6; }
.wp .wp-band__inner { position: relative; max-width: 980px; }
.wp .wp-band .wp-h2 { color: #fff; font-size: clamp(2.2rem, 4.6vw, 3.6rem); }
.wp .wp-band__text { margin-top: 26px; font-size: 1.12rem; color: rgba(255, 255, 255, .78); max-width: 70ch; }
.wp .wp-band--stats { padding: 60px 0; }
.wp .wp-band--stats .wp-stats { justify-content: space-between; position: relative; }

/* cta */
.wp .wp-cta { background: var(--paper); padding: clamp(60px, 8vw, 110px) 0; }
.wp .wp-cta__box {
  position: relative; overflow: hidden; isolation: isolate; border-radius: 24px;
  padding: clamp(40px, 6vw, 80px); color: #fff;
  background: radial-gradient(800px 400px at 100% 0%, rgba(196, 125, 63, .35), transparent 60%), linear-gradient(140deg, var(--pine-2), var(--ink));
  display: grid; grid-template-columns: 1.4fr auto; align-items: end; gap: 40px;
}
.wp .wp-cta__grid { position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(var(--line-light) 1px, transparent 1px), linear-gradient(90deg, var(--line-light) 1px, transparent 1px); background-size: 46px 46px; mask-image: linear-gradient(120deg, transparent 30%, #000); -webkit-mask-image: linear-gradient(120deg, transparent 30%, #000); opacity: .5; }
.wp .wp-cta__title { color: #fff; margin-bottom: 18px; font-size: clamp(2rem, 4vw, 3.1rem); }
.wp .wp-cta__copy p:not(.wp-kicker):not(.wp-cta__title) { color: rgba(255, 255, 255, .78); max-width: 62ch; }
.wp .wp-cta__copy p + p { margin-top: 12px; }
.wp .wp-cta .wp-actions { margin: 0; flex-direction: column; align-items: stretch; }

/* related links */
.wp .wp-related { background: var(--paper); border-top: 1px solid var(--line); padding: 34px 0; }
.wp .wp-related--home { background: var(--cream); }
.wp .wp-related__inner { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 34px; }
.wp .wp-related__label { font-size: .78rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--stone); }
.wp .wp-related__links { display: flex; flex-wrap: wrap; gap: 10px; }
.wp .wp-related__links a { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: .92rem; transition: background-color .3s, color .3s, border-color .3s; }
.wp .wp-related__links a:hover { background: var(--pine); color: #fff; border-color: var(--pine); }
.wp .wp-related__links a .wp-ico:last-child { width: 14px; opacity: .6; }

/* ---------------------------------------------------------------- contact */
.wp .wp-contact { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 6vw, 90px); align-items: start; }
.wp .wp-details { display: grid; gap: 12px; margin-top: 30px; }
.wp .wp-details li { display: flex; gap: 16px; align-items: center; padding: 16px 18px; background: #fff; border-radius: 12px; border: 1px solid var(--line); }
.wp .wp-details li > .wp-ico { width: 44px; height: 44px; padding: 11px; border-radius: 50%; background: var(--cream); color: var(--timber-ink); }
.wp .wp-details span { display: block; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--stone); font-weight: 700; }
.wp .wp-details a { font-weight: 700; }
.wp .wp-details a:hover { color: var(--timber-ink); }
.wp .wp-hours { margin-top: 26px; padding: 22px 24px; border-radius: 12px; background: var(--pine); color: #fff; }
.wp .wp-hours__title { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 12px; color: var(--timber-2); }
.wp .wp-hours li { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line-light); font-size: .95rem; }
.wp .wp-hours li span:first-child { color: rgba(255, 255, 255, .7); }

.wp .wp-form { background: #fff; border-radius: 20px; padding: clamp(26px, 4vw, 44px); box-shadow: var(--shadow); border: 1px solid var(--line); display: grid; gap: 18px; }
.wp .wp-form__title { font-family: var(--serif); font-size: 1.7rem; line-height: 1.2; }
.wp .wp-form__set { border: 0; margin: 0; padding: 0; min-width: 0; }
.wp .wp-form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.wp .wp-form__legend { padding: 0; margin-bottom: 8px; font-weight: 700; font-size: .9rem; }
.wp .wp-field { display: grid; gap: 6px; }
.wp .wp-field span { font-size: .85rem; font-weight: 600; color: var(--stone); }
.wp .wp-field em { font-style: normal; font-weight: 500; opacity: .7; }
.wp .wp-field input, .wp .wp-field textarea {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; transition: border-color .25s, box-shadow .25s, background-color .25s; resize: vertical;
}
.wp .wp-field input:focus, .wp .wp-field textarea:focus { outline: none; border-color: var(--timber); background: #fff; box-shadow: 0 0 0 4px rgba(196, 125, 63, .15); }
.wp .wp-field.is-invalid input, .wp .wp-field.is-invalid textarea { border-color: #b4462f; }
.wp .wp-form__status { font-size: .92rem; min-height: 1.4em; color: var(--pine); }
.wp .wp-form__status.is-error { color: #b4462f; }

/* ---------------------------------------------------------------- gallery & lightbox */
.wp .wp-gallery { columns: 3 300px; column-gap: 18px; }
.wp .wp-gallery__item { break-inside: avoid; margin-bottom: 18px; }
.wp .wp-gallery__btn { position: relative; display: block; width: 100%; padding: 0; border-radius: 12px; overflow: hidden; }
.wp .wp-gallery__btn img { width: 100%; transition: transform .9s var(--ease), filter .5s; }
.wp .wp-gallery__btn:hover img { transform: scale(1.05); filter: brightness(.8); }
.wp .wp-gallery__zoom { position: absolute; right: 14px; bottom: 14px; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--timber); color: #fff; font-size: 1.5rem; opacity: 0; transform: scale(.6); transition: opacity .3s, transform .4s var(--ease); }
.wp .wp-gallery__btn:hover .wp-gallery__zoom, .wp .wp-gallery__btn:focus-visible .wp-gallery__zoom { opacity: 1; transform: scale(1); }
.wp .wp-lightbox { position: fixed; inset: 0; z-index: 200; background: rgba(12, 18, 15, .94); display: grid; place-items: center; padding: 60px 70px; }
.wp .wp-lightbox[hidden] { display: none; }
.wp .wp-lightbox__fig { max-width: 1200px; display: grid; gap: 14px; }
.wp .wp-lightbox__fig img { max-height: 78vh; width: auto; margin: 0 auto; border-radius: 10px; }
.wp .wp-lightbox__fig figcaption { color: rgba(255, 255, 255, .75); text-align: center; font-size: .92rem; max-width: 80ch; margin: 0 auto; }
.wp .wp-lightbox__close, .wp .wp-lightbox__nav { position: absolute; width: 50px; height: 50px; border-radius: 50%; color: #fff; font-size: 1.8rem; line-height: 1; background: rgba(255, 255, 255, .1); transition: background-color .3s; }
.wp .wp-lightbox__close:hover, .wp .wp-lightbox__nav:hover { background: var(--timber); }
.wp .wp-lightbox__close { top: 18px; right: 18px; }
.wp .wp-lightbox__nav--prev { left: 14px; top: 50%; translate: 0 -50%; }
.wp .wp-lightbox__nav--next { right: 14px; top: 50%; translate: 0 -50%; }

/* ---------------------------------------------------------------- footer */
.wp .wp-footer { background: var(--ink); color: rgba(255, 255, 255, .72); padding: 90px 0 0; font-size: .95rem; }
.wp .wp-footer__top { display: grid; grid-template-columns: 1.5fr repeat(4, 1fr); gap: 40px; padding-bottom: 60px; }
.wp .wp-footer__logo { width: 160px; filter: brightness(0) invert(1); margin-bottom: 20px; }
.wp .wp-footer__brand p { max-width: 30ch; }
.wp .wp-footer__social { display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; color: #fff; font-weight: 600; }
.wp .wp-footer__social .wp-ico { width: 38px; height: 38px; padding: 9px; border-radius: 50%; border: 1px solid var(--line-light); transition: background-color .3s, border-color .3s; }
.wp .wp-footer__social:hover .wp-ico { background: var(--timber); border-color: var(--timber); }
.wp .wp-footer__title { color: #fff; font-weight: 700; margin-bottom: 16px; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; }
.wp .wp-footer__col li + li { margin-top: 10px; }
.wp .wp-footer__col a { transition: color .2s; }
.wp .wp-footer__col a:hover { color: var(--timber-2); }
.wp .wp-footer__contact li { display: flex; gap: 10px; align-items: flex-start; }
.wp .wp-footer__contact .wp-ico { margin-top: 4px; color: var(--timber-2); }
.wp .wp-footer__bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding: 26px 0; border-top: 1px solid var(--line-light); font-size: .85rem; color: rgba(255, 255, 255, .5); }

/* ---------------------------------------------------------------- reveal animation */
.wp.wp-js [data-wp-reveal] { opacity: 0; transform: translateY(28px); transition: opacity .9s var(--ease) var(--d, 0ms), transform .9s var(--ease) var(--d, 0ms); }
.wp.wp-js [data-wp-reveal].is-in { opacity: 1; transform: none; }
.wp .wp-hero--home .wp-hero__copy > *, .wp .wp-hero--page .wp-hero__inner > * { animation: wpRise 1s var(--ease) both; }
.wp .wp-hero__copy > :nth-child(2), .wp .wp-hero__inner > :nth-child(2) { animation-delay: .08s; }
.wp .wp-hero__copy > :nth-child(3), .wp .wp-hero__inner > :nth-child(3) { animation-delay: .16s; }
.wp .wp-hero__copy > :nth-child(4), .wp .wp-hero__inner > :nth-child(4) { animation-delay: .24s; }
.wp .wp-hero__copy > :nth-child(5), .wp .wp-hero__inner > :nth-child(5) { animation-delay: .32s; }
.wp .wp-hero__inner > :nth-child(6) { animation-delay: .4s; }
@keyframes wpRise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }

/* ---------------------------------------------------------------- responsive */
@media (max-width: 1100px) {
  .wp .wp-cards { grid-template-columns: repeat(2, 1fr); }
  .wp .wp-cards--3 { grid-template-columns: repeat(3, 1fr); }

}

  .wp .wp-drop__link:hover, .wp .wp-drop__link[aria-current="page"] { background: none; color: var(--timber-2); }
  .wp .wp-nav__foot { display: grid; gap: 12px; margin-top: auto; padding-top: 30px; color: rgba(255, 255, 255, .8); }
  .wp .wp-nav__foot a { display: flex; align-items: center; gap: 10px; }

  .wp .wp-split, .wp .wp-contact, .wp .wp-cards-head { grid-template-columns: 1fr; }

  .wp .wp-frame img { aspect-ratio: 4 / 3.4; }
  .wp .wp-cards--3 { grid-template-columns: 1fr; }
  .wp .wp-steps { grid-template-columns: 1fr; gap: 34px; }

  .wp .wp-step { display: grid; grid-template-columns: 68px 1fr; gap: 0 22px; padding: 0; }

  .wp .wp-cta__box { grid-template-columns: 1fr; }

  .wp .wp-hero__scroll { display: none; }
}
@media (max-width: 640px) {

  .wp .wp-cards { grid-template-columns: 1fr; }

  .wp .wp-hero--page { min-height: 0; padding-bottom: 56px; }
  .wp .wp-stats { gap: 22px; width: 100%; justify-content: space-between; }

  .wp .wp-intro__inner { grid-template-columns: 1fr; }

  .wp .wp-form__row { grid-template-columns: 1fr; }
  .wp .wp-footer__top { grid-template-columns: 1fr; }
  .wp .wp-btn { padding: 0 22px; }
  .wp .wp-split__media { margin-inline: 0 18px; }

}
@media (prefers-reduced-motion: reduce) {
  .wp *, .wp *::before, .wp *::after { animation: none !important; transition: none !important; }
  .wp.wp-js [data-wp-reveal] { opacity: 1; transform: none; }
}
